    let pasosActuales = [];
    let indiceActivo = 0;

   // Referencias directas al DOM
    const selector = document.getElementById('selector-historia');
    const txtExplicacion = document.getElementById('explicacion-texto');
    const contenedorFlujo = document.getElementById('contenedor-flujo');
    const controlesHistoria = document.getElementById('controles-historia');
    const btnAnterior = document.getElementById('btn-anterior');
    const btnSiguiente = document.getElementById('btn-siguiente');
    const contadorPasos = document.getElementById('contador-pasos');

    // 1. Función gatillada por tu "onchange" del select
    function cargarHistoriaAutomatica() {
      const seleccion = selector.value;
      if (seleccion && baseHistorias[seleccion]) {
        pasosActuales = baseHistorias[seleccion].pasos;
        txtExplicacion.value = baseHistorias[seleccion].explicacion;
        indiceActivo = 0; 
        mostrarPasoSeleccionado();
      } else {
        reiniciarPantalla();
      }
    }

    // 2. Función encargada de renderizar la tarjeta y alternar las clases CSS de ocultado
        // 2. RECONSTRUYE LAS TARJETAS APLICANDO LAS NUEVAS CLASES CSS DE AUDIO Y SECUENCIA
      // 2. RECONSTRUYE LAS TARJETAS RECREANDO UN SOLO ELEMENTO ACTIVO A LA VEZ
    function mostrarPasoSeleccionado() {
      if (pasosActuales.length === 0) {
        contenedorFlujo.innerHTML = '<p class="placeholder-flujo">Elige una rutina en el menú de arriba para generar la secuencia visual...</p>';
        controlesHistoria.style.display = 'none';
        return;
      }

      // Volver visible la barra de los botones Anterior/Siguiente
      controlesHistoria.style.display = 'flex';

      // Tomamos exclusivamente el paso activo correspondiente al índice actual
      const paso = pasosActuales[indiceActivo];
      
      // Armamos la ruta uniendo los textos de forma clásica con el signo + para asegurar compatibilidad
       const urlImagen = "https://static.arasaac.org/pictograms/" + paso.id + "/" + paso.id + "_500.png";
     const textoLimpio = paso.palabra || "";
      const numeroPaso = indiceActivo + 1;

      // Inyectamos ÚNICAMENTE la tarjeta activa. Al no haber bucle, es imposible que se duplique el texto o se encimen tarjetas.
      contenedorFlujo.innerHTML = `
        <div class="paso-historia" style="position: relative;">
          
          <!-- Círculo del Número de Secuencia -->
          <div class="numero-secuencia">${numeroPaso}</div>

          <!-- Botón del Altavoz -->
          <button class="btn-audio-pictograma" 
                  onclick="reproducirAudio('${textoLimpio}')" 
                  data-html2canvas-ignore="true">
            🔊
          </button>

          <!-- Imagen Clickable de ARASAAC -->
          <img src="${urlImagen}" 
               alt="${textoLimpio}" 
               referrerpolicy="no-referrer" 
               onclick="reproducirAudio('${textoLimpio}')">
               
          <p>${textoLimpio}</p>
        </div>
      `;

      // Actualiza la numeración intermedia (Paso 1 de 4)
      contadorPasos.textContent = "Paso " + numeroPaso + " de " + pasosActuales.length;

      // Deshabilita los botones de forma segura en los extremos
      btnAnterior.disabled = (indiceActivo === 0);
      btnSiguiente.disabled = (indiceActivo === pasosActuales.length - 1);
    }


    // FUNCIÓN DE REPRODUCCIÓN DE VOZ DIGITAL NATIVA
    function reproducirAudio(texto) {
      if (!texto) return;
      
      // Cancela lecturas previas inmediatamente
      window.speechSynthesis.cancel();
      
      const mensaje = new SpeechSynthesisUtterance(texto);
      mensaje.lang = 'es-ES'; // Configurado en español de España (o es-419 según el dispositivo)
      mensaje.pitch = 1;      // Tono de voz amigable
      mensaje.rate = 0.75;    // Velocidad un poco pausada para facilitar la asimilación cognitiva
      
      window.speechSynthesis.speak(mensaje);
    }


	    // 3. Función global requerida por tus disparadores "onclick" de los botones Anterior/Siguiente
     function cambiarPaso(direccion) {
      const nuevaPosicion = indiceActivo + direccion;
      if (nuevaPosicion >= 0 && nuevaPosicion < pasosActuales.length) {
        indiceActivo = nuevaPosicion;
        mostrarPasoSeleccionado();
      }
    }

  // 4. Función de reinicio vinculada al botón "Limpiar Todo"
function reiniciarPantalla() {
selector.value = "";
txtExplicacion.value = "";
pasosActuales = [];
indiceActivo = 0;
mostrarPasoSeleccionado();
}
// Función de control de la impresora nativa
    function imprimirRutina() {
      // 1. Buscamos todas las tarjetas que están ocultas en pantalla
      const tarjetasOcultas = contenedorFlujo.querySelectorAll('.paso-historia.ocultar-en-pantalla');

      // 2. Les removemos la clase de ocultación momentáneamente para que la impresora las pueda leer todas juntas
      tarjetasOcultas.forEach(tarjeta => {
        tarjeta.classList.remove('ocultar-en-pantalla');
      });

      // 3. Ejecutamos la ventana de impresión nativa del navegador
      window.print();

      // 4. Cuando el usuario cierra o guarda el documento, les devolvemos la clase para restaurar el carrusel en pantalla
      tarjetasOcultas.forEach(tarjeta => {
        tarjeta.classList.add('ocultar-en-pantalla');
      });
    }
