    const contenedorFlujo = document.getElementById('contenedor-flujo');

    // 1. Función gatillada por tu "onchange" del select
    function cargarHistoriaAutomatica() {
      const seleccion = selector.value;
      if (seleccion && baseHistorias[seleccion]) {
        pasosActuales = baseHistorias[seleccion].pasos;
        txtExplicacion.value = baseHistorias[seleccion].explicacion;
        indiceActivo = 0; 
        mostrarPasoSeleccionado();
      } else {
        reiniciarPantalla();
      }
    }

    // 2. Función encargada de renderizar la tarjeta y alternar las clases CSS de ocultado
        // 2. RECONSTRUYE LAS TARJETAS APLICANDO LAS NUEVAS CLASES CSS DE AUDIO Y SECUENCIA
      // 2. RECONSTRUYE LAS TARJETAS RECREANDO UN SOLO ELEMENTO ACTIVO A LA VEZ
    function mostrarPasoSeleccionado() {
      if (pasosActuales.length === 0) {
        contenedorFlujo.innerHTML = '<p class="placeholder-flujo">Elige una rutina en el menú de arriba para generar la secuencia visual...</p>';
        controlesHistoria.style.display = 'none';
        return;
      }

      // Mostrar la barra de navegación
      controlesHistoria.style.display = 'flex';

      // Generar TODAS las tarjetas de la historia
      let htmlTarjetas = '';
      pasosActuales.forEach((paso, index) => {
      
      // Armamos la ruta uniendo los textos de forma clásica con el signo + para asegurar compatibilidad
       const urlImagen = "https://static.arasaac.org/pictograms/" + paso.id + "/" + paso.id + "_500.png";
     const textoLimpio = paso.palabra || "";
      const numeroPaso = indiceActivo + 1;
        // Solo la tarjeta activa se muestra en pantalla; las demás llevan 'ocultar-en-pantalla'
        const claseOcultar = (index === indiceActivo) ? '' : 'ocultar-en-pantalla';

        htmlTarjetas += `
        <div class="paso-historia ${claseOcultar}" style="position: relative;">
          
          <!-- Círculo del Número de Secuencia -->
          <div class="numero-secuencia">${numeroPaso}</div>

          <!-- Botón del Altavoz -->
          <button class="btn-audio-pictograma" 
                  onclick="reproducirAudio('${textoLimpio}')" 
                  data-html2canvas-ignore="true">
            🔊
          </button>

          <!-- Imagen Clickable de ARASAAC -->
          <img src="${urlImagen}" 
               alt="${textoLimpio}" 
               referrerpolicy="no-referrer" 
               onclick="reproducirAudio('${textoLimpio}')">
               
          <p>${textoLimpio}</p>
        </div>
      `;
});

      // Inyectar la secuencia completa en el contenedor
      contenedorFlujo.innerHTML = htmlTarjetas;

      // Actualizar contador y botones
      const pasoActualNum = indiceActivo + 1;
      contadorPasos.textContent = "Paso " + pasoActualNum + " de " + pasosActuales.length;
      btnAnterior.disabled = (indiceActivo === 0);
      btnSiguiente.disabled = (indiceActivo === pasosActuales.length - 1);
    }


    // FUNCIÓN DE REPRODUCCIÓN DE VOZ DIGITAL NATIVA
    function reproducirAudio(texto) {
      if (!texto) return;
      
      // Cancela lecturas previas inmediatamente
      window.speechSynthesis.cancel();
      
      const mensaje = new SpeechSynthesisUtterance(texto);
      mensaje.lang = 'es-ES'; // Configurado en español de España (o es-419 según el dispositivo)
      mensaje.pitch = 1;      // Tono de voz amigable
      mensaje.rate = 0.75;    // Velocidad un poco pausada para facilitar la asimilación cognitiva
      
      window.speechSynthesis.speak(mensaje);
    }


	    // 3. Función global requerida por tus disparadores "onclick" de los botones Anterior/Siguiente
     function cambiarPaso(direccion) {
      const nuevaPosicion = indiceActivo + direccion;
      if (nuevaPosicion >= 0 && nuevaPosicion < pasosActuales.length) {
        indiceActivo = nuevaPosicion;
        mostrarPasoSeleccionado();
      }
    }

  // 4. Función de reinicio vinculada al botón "Limpiar Todo"
function reiniciarPantalla() {
selector.value = "";
txtExplicacion.value = "";
pasosActuales = [];
indiceActivo = 0;
mostrarPasoSeleccionado();
}
// Función de control de la impresora nativa
  function imprimirRutina() {
  if (pasosActuales.length === 0) {
    alert("Primero selecciona una historia social para imprimir.");
    return;
  }

  const tituloHistoria = selector.options[selector.selectedIndex].text;
  const explicacion = txtExplicacion.value;

  // 1. Eliminar iframe anterior si existe
  const iframeViejo = document.getElementById('iframe-impresion');
  if (iframeViejo) iframeViejo.remove();

  // 2. Crear un iframe invisible en la misma página (evita bloqueos de pop-ups)
  const iframe = document.createElement('iframe');
  iframe.id = 'iframe-impresion';
  iframe.style.position = 'fixed';
  iframe.style.right = '0';
  iframe.style.bottom = '0';
  iframe.style.width = '0';
  iframe.style.height = '0';
  iframe.style.border = '0';
  document.body.appendChild(iframe);

  // 3. Construir todas las tarjetas de la secuencia
  const tarjetasHTML = pasosActuales.map((paso, index) => `
    <div class="tarjeta">
      <div class="numero">${index + 1}</div>  
      <img src="https://static.arasaac.org/pictograms/${paso.id}/${paso.id}_500.png" alt="${paso.palabra}">
      <p>${paso.palabra}</p>
    </div>
  `).join('');

  // 4. Escribir el documento limpio dentro del iframe
  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(`
    <!DOCTYPE html>
    <html lang="es">
    <head>
      <meta charset="UTF-8">
      <title>${tituloHistoria}</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          color: #2c3e50;
          margin: 10mm;
          text-align: center;
        }
        h2 { margin: 0 0 8px 0; font-size: 18pt; }
        .explicacion { font-size: 11pt; color: #555; margin-bottom: 15px; }
        .tarjeta {
          display: inline-block;
          vertical-align: top;
          width: 120px;
          margin: 6px;
          padding: 8px;
          border: 1px solid #ccc;
          border-radius: 12px;
          page-break-inside: avoid;
          break-inside: avoid;
        }
        .numero {
          width: 22px;
          height: 22px;
          line-height: 22px;
          background: #2c3e50;
          color: white;
          border-radius: 50%;
          font-weight: bold;
          font-size: 11px;
          margin: 0 auto 5px auto;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        .tarjeta img {
          width: 90px;
          height: 90px;
          object-fit: contain;
        }
        .tarjeta p {
          margin: 6px 0 0 0;
          font-weight: bold;
          font-size: 10pt;
        }
      </style>
    </head>
    <body>
      <h2>${tituloHistoria}</h2>
      <p class="explicacion">${explicacion}</p>
      <div>${tarjetasHTML}</div>
    </body>
    </html>
  `);
  doc.close();

  // 5. Esperar a que carguen todas las imágenes antes de lanzar la impresión
  const imagenes = doc.querySelectorAll('img');
  let cargadas = 0;

  function lanzarImpresion() {
    iframe.contentWindow.focus();
    iframe.contentWindow.print();
  }

  if (imagenes.length === 0) {
    lanzarImpresion();
  } else {
    imagenes.forEach(img => {
      if (img.complete) {
        cargadas++;
        if (cargadas === imagenes.length) lanzarImpresion();
      } else {
        img.onload = img.onerror = () => {
          cargadas++;
          if (cargadas === imagenes.length) lanzarImpresion();
        };
      }
    });
  }
}

  </script>

</body>
