	function cargarHistoriaAutomatica() {
	const seleccion = document.getElementById('selector-historia').value;
	const campoTexto = document.getElementById('explicacion-texto');
	const cajaFlujo = document.getElementById('caja-historia');

	// Si selecciona la opción vacía o inválida, limpiamos la pantalla
	if (!seleccion || !baseHistorias[seleccion]) {
		reiniciarPantalla();
		return;
	}

	const datosHistoria = baseHistorias[seleccion];

	// 1. Colocamos la explicación correspondiente en el cuadro de texto
	campoTexto.value = datosHistoria.explicacion;

	// 2. Generamos las tarjetas de los pictogramas
	let htmlPasos = "";
	datosHistoria.pasos.forEach(paso => {
    // URL verificada y estructurada correctamente con template literals de JS
    const urlImagen = "https://static.arasaac.org/pictograms/" + paso.id + "/" + paso.id + "_500.png";
    
    htmlPasos += `
    <div class="paso-historia" style="display: inline-block; text-align: center; margin: 15px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background-color: #fff;">
    <img src="${urlImagen}" alt="${paso.palabra}" style="width: 150px; height: 150px; display: block; margin: 0 auto 10px auto; object-fit: contain;">
    <span style="font-family: Arial, sans-serif; font-weight: bold; font-size: 14px; color: #2c3e50;">${paso.palabra.toUpperCase()}</span>
    </div>
    `;
	});

	// 3. Pintamos las imágenes y textos en el contenedor de flujo
	cajaFlujo.innerHTML = htmlPasos;
	}

    function reiniciarPantalla() {
      document.getElementById('selector-historia').value = "";
      document.getElementById('explicacion-texto').value = "";
      document.getElementById('caja-historia').innerHTML = `
        <p style="color: #95a5a6;" id="texto-vacio">Elige una rutina en el menú de arriba para generar la secuencia visual...</p>
      `;
    }


	function imprimirRutina() {
    const selector = document.getElementById('selector-historia');
    if (!selector.value) {
        alert("Por favor, selecciona una historia social antes de imprimir.");
        return;
    }
    // Lanza la ventana de impresión nativa. Gracias al CSS (@media print),
    // solo se imprimirá el cuadro de texto estructurado de la historia social.
    window.print();
	}
